# Microsoft's documented AKS agent deployment, with one deliberate change.
# Source: https://learn.microsoft.com/azure/devops/pipelines/agents/docker#use-azure-kubernetes-service-cluster
# (retrieved 9 November 2026). The "azdevops" secret it reads is created by scripts/deploy.ps1.
#
# Change: the documented hostPath mount of /var/run/docker.sock is removed. AKS nodes use containerd,
# so there is no Docker socket (Microsoft's page says Docker tasks don't work on AKS 1.19 or later), and
# a hostPath mount would only weaken pod isolation. __IMAGE__ is replaced at deployment time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azdevops-deployment
  labels:
    app: azdevops-agent
spec:
  replicas: 1 # here is the configuration for the actual agent always running
  selector:
    matchLabels:
      app: azdevops-agent
  template:
    metadata:
      labels:
        app: azdevops-agent
    spec:
      containers:
      - name: kubepodcreation
        image: __IMAGE__
        env:
          - name: AZP_URL
            valueFrom:
              secretKeyRef:
                name: azdevops
                key: AZP_URL
          - name: AZP_TOKEN
            valueFrom:
              secretKeyRef:
                name: azdevops
                key: AZP_TOKEN
          - name: AZP_POOL
            valueFrom:
              secretKeyRef:
                name: azdevops
                key: AZP_POOL
